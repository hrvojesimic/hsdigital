<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kviz iz geografije - 7. razred</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #5f6c7b;
      --paper: #f7f3ea;
      --surface: #fffaf0;
      --line: #d8cfbf;
      --teal: #0f766e;
      --teal-dark: #0b5f59;
      --rust: #b45309;
      --green: #2f855a;
      --rose: #b42318;
      --shadow: 0 18px 45px rgba(54, 43, 30, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .total-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(255, 250, 240, 0.78);
      color: var(--muted);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: start;
    }

    .quiz-panel,
    .side-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .quiz-panel {
      padding: 22px;
    }

    .side-panel {
      padding: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--ink);
    }

    .toggle {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
    }

    .button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 14px;
      background: var(--teal);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .button:hover {
      background: var(--teal-dark);
      transform: translateY(-1px);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .button.secondary {
      background: #ffffff;
      color: var(--ink);
      border-color: var(--line);
    }

    .button.secondary:hover {
      background: #f2eadc;
    }

    .button.good {
      background: var(--green);
    }

    .button.good:hover {
      background: #276749;
    }

    .button.repeat {
      background: var(--rust);
    }

    .button.repeat:hover {
      background: #92400e;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      padding: 0 10px;
      background: #e6f3f0;
      color: var(--teal-dark);
      font-size: 0.9rem;
    }

    .progress-wrap {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #eadfce;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--teal);
      transition: width 0.2s ease;
    }

    .question-number {
      color: var(--rust);
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .question {
      margin: 8px 0 18px;
      font-size: clamp(1.25rem, 3vw, 1.85rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .answer-input {
      width: 100%;
      min-height: 126px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
      color: var(--ink);
    }

    .answer-box {
      display: none;
      margin-top: 14px;
      border-left: 4px solid var(--teal);
      padding: 14px 16px;
      background: #eef8f5;
      border-radius: 0 8px 8px 0;
    }

    .answer-box.visible {
      display: block;
    }

    .answer-box strong {
      display: block;
      margin-bottom: 6px;
      color: var(--teal-dark);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #ffffff;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 1.4rem;
    }

    .review-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
      padding-top: 2px;
    }

    .chip {
      border: 1px solid #e6b17a;
      border-radius: 999px;
      padding: 4px 9px;
      background: #fff7ed;
      color: #92400e;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .empty-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .summary {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #ffffff;
    }

    .summary.visible {
      display: block;
    }

    @media (max-width: 850px) {
      .app {
        width: min(100% - 24px, 680px);
        padding: 22px 0;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .quiz-panel,
      .side-panel {
        padding: 16px;
      }

      .button,
      select,
      .toggle {
        width: 100%;
        justify-content: center;
      }

      .meta-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Kviz iz geografije</h1>
        <p class="subtitle">Sjeverna i Istočna Europa, 7. razred</p>
      </div>
      <div class="total-pill" id="totalQuestions">64 pitanja</div>
    </header>

    <div class="layout">
      <section class="quiz-panel" aria-label="Kviz">
        <div class="controls">
          <select id="sectionFilter" aria-label="Odabir cjeline">
            <option value="all">Sve cjeline</option>
            <option value="Istočna Europa">Istočna Europa</option>
            <option value="Sjeverna Europa">Sjeverna Europa</option>
          </select>

          <label class="toggle">
            <input type="checkbox" id="shuffleToggle" checked>
            Nasumično
          </label>

          <button class="button secondary" id="restartButton" type="button">Ponovno</button>
        </div>

        <div class="meta-row">
          <span class="section-badge" id="sectionName">Istočna Europa</span>
          <span id="progressText">1 / 64</span>
        </div>
        <div class="progress-wrap" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question-number" id="questionNumber">Pitanje 1</div>
        <h2 class="question" id="questionText"></h2>

        <textarea class="answer-input" id="answerInput" placeholder="Upiši svoj odgovor pa prikaži rješenje."></textarea>

        <div class="answer-box" id="answerBox">
          <strong>Odgovor</strong>
          <div id="answerText"></div>
        </div>

        <div class="actions">
          <button class="button" id="showAnswer" type="button">Prikaži odgovor</button>
          <button class="button good" id="knownButton" type="button" disabled>Znam</button>
          <button class="button repeat" id="repeatButton" type="button" disabled>Ponovi</button>
          <button class="button secondary" id="previousButton" type="button">Natrag</button>
          <button class="button secondary" id="nextButton" type="button">Dalje</button>
        </div>

        <div class="summary" id="summaryBox"></div>
      </section>

      <aside class="side-panel" aria-label="Napredak">
        <h2>Napredak</h2>
        <div class="stats">
          <div class="stat">
            <span>Znam</span>
            <strong id="knownCount">0</strong>
          </div>
          <div class="stat">
            <span>Ponoviti</span>
            <strong id="repeatCount">0</strong>
          </div>
        </div>

        <h2>Za ponoviti</h2>
        <div class="review-list" id="reviewList">
          <p class="empty-note">Još nema označenih pitanja.</p>
        </div>
      </aside>
    </div>
  </main>

  </script>

  <script>
    const allQuestions = JSON.parse(document.getElementById("quiz-data").textContent);

    const state = {
      pool: [],
      index: 0,
      revealed: false,
      known: new Set(),
      repeat: new Set(),
      drafts: new Map()
    };

    const els = {
      totalQuestions: document.getElementById("totalQuestions"),
      sectionFilter: document.getElementById("sectionFilter"),
      shuffleToggle: document.getElementById("shuffleToggle"),
      restartButton: document.getElementById("restartButton"),
      sectionName: document.getElementById("sectionName"),
      progressText: document.getElementById("progressText"),
      progressBar: document.getElementById("progressBar"),
      questionNumber: document.getElementById("questionNumber"),
      questionText: document.getElementById("questionText"),
      answerInput: document.getElementById("answerInput"),
      answerBox: document.getElementById("answerBox"),
      answerText: document.getElementById("answerText"),
      showAnswer: document.getElementById("showAnswer"),
      knownButton: document.getElementById("knownButton"),
      repeatButton: document.getElementById("repeatButton"),
      previousButton: document.getElementById("previousButton"),
      nextButton: document.getElementById("nextButton"),
      knownCount: document.getElementById("knownCount"),
      repeatCount: document.getElementById("repeatCount"),
      reviewList: document.getElementById("reviewList"),
      summaryBox: document.getElementById("summaryBox")
    };

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildPool() {
      const selected = els.sectionFilter.value;
      const filtered = selected === "all"
        ? allQuestions
        : allQuestions.filter((item) => item.section === selected);

      state.pool = els.shuffleToggle.checked ? shuffle(filtered) : [...filtered];
      state.index = 0;
      state.revealed = false;
      state.known.clear();
      state.repeat.clear();
      state.drafts.clear();
      render();
    }

    function currentQuestion() {
      return state.pool[state.index];
    }

    function saveDraft() {
      const item = currentQuestion();
      if (!item) return;
      state.drafts.set(item.id, els.answerInput.value);
    }

    function renderStats() {
      els.knownCount.textContent = state.known.size;
      els.repeatCount.textContent = state.repeat.size;

      const repeatIds = [...state.repeat].sort((a, b) => a - b);
      if (repeatIds.length === 0) {
        els.reviewList.innerHTML = '<p class="empty-note">Još nema označenih pitanja.</p>';
        return;
      }

      els.reviewList.innerHTML = repeatIds
        .map((id) => `<span class="chip">#${id}</span>`)
        .join("");
    }

    function renderSummary() {
      if (state.index < state.pool.length) {
        els.summaryBox.classList.remove("visible");
        els.summaryBox.textContent = "";
        return;
      }

      els.summaryBox.classList.add("visible");
      els.summaryBox.innerHTML = `
        <strong>Kraj kruga.</strong>
        <div>Znao/la si ${state.known.size} od ${state.pool.length} pitanja. Za ponoviti: ${state.repeat.size}.</div>
      `;
    }

    function render() {
      renderStats();
      renderSummary();

      const item = currentQuestion();
      const total = state.pool.length;
      els.totalQuestions.textContent = `${allQuestions.length} pitanja`;

      if (!item) {
        els.sectionName.textContent = els.sectionFilter.value === "all" ? "Sve cjeline" : els.sectionFilter.value;
        els.progressText.textContent = `${total} / ${total}`;
        els.progressBar.style.width = "100%";
        els.questionNumber.textContent = "Gotovo";
        els.questionText.textContent = "Završen je ovaj krug pitanja.";
        els.answerInput.value = "";
        els.answerInput.disabled = true;
        els.answerBox.classList.remove("visible");
        els.showAnswer.disabled = true;
        els.knownButton.disabled = true;
        els.repeatButton.disabled = true;
        els.previousButton.disabled = total === 0;
        els.nextButton.disabled = true;
        return;
      }

      els.answerInput.disabled = false;
      els.sectionName.textContent = item.section;
      els.progressText.textContent = `${state.index + 1} / ${total}`;
      els.progressBar.style.width = `${((state.index + 1) / total) * 100}%`;
      els.questionNumber.textContent = `Pitanje ${item.id}`;
      els.questionText.textContent = item.question;
      els.answerInput.value = state.drafts.get(item.id) || "";
      els.answerText.textContent = item.answer;
      els.answerBox.classList.toggle("visible", state.revealed);
      els.showAnswer.disabled = state.revealed;
      els.knownButton.disabled = !state.revealed;
      els.repeatButton.disabled = !state.revealed;
      els.previousButton.disabled = state.index === 0;
      els.nextButton.disabled = false;
    }

    function goTo(delta) {
      saveDraft();
      state.index = Math.max(0, Math.min(state.pool.length, state.index + delta));
      state.revealed = false;
      render();
    }

    els.answerInput.addEventListener("input", saveDraft);

    els.showAnswer.addEventListener("click", () => {
      state.revealed = true;
      render();
    });

    els.knownButton.addEventListener("click", () => {
      const item = currentQuestion();
      if (!item) return;
      state.known.add(item.id);
      state.repeat.delete(item.id);
      goTo(1);
    });

    els.repeatButton.addEventListener("click", () => {
      const item = currentQuestion();
      if (!item) return;
      state.repeat.add(item.id);
      state.known.delete(item.id);
      goTo(1);
    });

    els.previousButton.addEventListener("click", () => goTo(-1));
    els.nextButton.addEventListener("click", () => goTo(1));
    els.restartButton.addEventListener("click", buildPool);
    els.sectionFilter.addEventListener("change", buildPool);
    els.shuffleToggle.addEventListener("change", buildPool);

    buildPool();
  </script>
